name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 经 env 间接引用 secrets，才能在 step 的 if: 条件中判断是否可用
      #（GitHub 不允许在 if: 中直接引用 secrets）。
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode 默认取 HEAD 提交数，需要完整历史
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.available == 'true'
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/breakpoint-release.jks"

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Lint and compile instrumentation tests
        run: ./gradlew :app:lintDebug :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Build debug APK, release APK and release AAB
        env:
          # 无签名材料时（fork PR）为空串，构建脚本视为未提供 → release 未签名，
          # 保持阶段 8 之前的 CI 行为。
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.available == 'true' && format('{0}/breakpoint-release.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION_ARGS=()
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION_ARGS=("-Pbilliards.versionName=${GITHUB_REF_NAME#v}")
          fi
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease \
            "${VERSION_ARGS[@]}" --stacktrace

      - name: Verify release signatures
        if: steps.signing.outputs.available == 'true'
        run: |
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: SHA-256 checksums of release artifacts
        # 仅记录文件名（不含目录前缀），与 release job 下载后的文件名一致，
        # 使 sha256sum -c 可直接核对。
        run: |
          {
            (cd app/build/outputs/apk/release && sha256sum ./*.apk | sed 's| \./| |')
            (cd app/build/outputs/bundle/release && sha256sum ./*.aab | sed 's| \./| |')
          } | tee checksums-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: billiards-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: billiards-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: billiards-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release checksums
        uses: actions/upload-artifact@v4
        with:
          name: billiards-release-checksums
          path: checksums-sha256.txt
          if-no-files-found: error

      - name: Upload release mapping
        uses: actions/upload-artifact@v4
        with:
          name: billiards-release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn

  instrumentation:
    name: Instrumentation tests (API 35 ATD emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --stacktrace --info
            code=$?
            adb logcat -d -v threadtime > instrumentation-logcat.txt || true
            exit $code

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billiards-instrumentation-results
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            instrumentation-logcat.txt
          if-no-files-found: warn

  gl-smoke:
    name: GL smoke and save matrix (API 37 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run GL smoke and corruption-matrix tests on Android 17
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.minamikune.billiards.gl.GlSmokeTest,com.minamikune.billiards.data.SaveStoreTest \
              --stacktrace --info
            code=$?
            adb logcat -d -v threadtime > gl-smoke-logcat.txt || true
            exit $code

      - name: Upload GL smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billiards-gl-smoke-results
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            gl-smoke-logcat.txt
          if-no-files-found: warn

  release:
    name: Publish signed release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, instrumentation, gl-smoke ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - name: Require signing secrets
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Tag releases require the SIGNING_KEYSTORE_BASE64 secret. See docs/release/SIGNING.md."
            exit 1
          fi

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: billiards-release-apk
          path: artifacts

      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: billiards-release-aab
          path: artifacts

      - name: Download release checksums
        uses: actions/download-artifact@v4
        with:
          name: billiards-release-checksums
          path: artifacts

      - name: Download release mapping
        uses: actions/download-artifact@v4
        with:
          name: billiards-release-mapping
          path: artifacts/mapping

      - name: Sanity-check downloaded artifacts
        run: |
          ls -l artifacts
          test -f artifacts/app-release.apk
          test -f artifacts/app-release.aab
          test -f artifacts/checksums-sha256.txt
          cd artifacts && sha256sum -c checksums-sha256.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/app-release.apk
            artifacts/app-release.aab
            artifacts/checksums-sha256.txt
            artifacts/mapping/mapping.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Break Point 桌球 — signed Android release.

            - `app-release.apk`：签名 release APK（APK Signature Scheme v2，可直接安装/升级）。
            - `app-release.aab`：签名 Android App Bundle（供商店分发）。
            - `checksums-sha256.txt`：上述产物的 SHA-256 校验和。
            - `mapping.txt`：R8 混淆映射，用于该版本崩溃日志还原。

            签名证书指纹见 [`docs/release/SIGNING.md`](docs/release/SIGNING.md)。
