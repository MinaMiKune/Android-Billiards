# Break Point runtime configuration (read once by BilliardsApplication).
# Physics constants intentionally stay in Kotlin so this file cannot alter the
# simulation contract. Every value below is validated and clamped at load time.
config.version=1

# Branded startup overlay.
splash.minMillis=850
splash.fadeMillis=220

# HUD snapshot cadence. Physics still runs at the fixed 480 Hz step.
loop.snapshotIntervalSeconds=0.075

# Automatic quality threshold (ActivityManager memory class).
quality.highMemoryClass=256

# SoundPool concurrency.
audio.maxStreams=10
